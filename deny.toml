[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0",
]

[bans]
multiple-versions = "allow"
# The runner must not link the AGPL hosting-core crates: it is a separate
# MIT/Apache binary that speaks JSON over stdio.
deny = [{ name = "hosting-core" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
