[package]
name = "ptyktos-agent-runner"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The Ptyktos substrate as a saga runner — implements the RunnerJob/RunnerEvent contract for the 5 lifecycle phases (plan/apply/verify/compensate/destroy). Plugs into the Tasmanian-Cloud/saga `runner` crate as a 6th binary alongside tofu-runner/ansible-runner/helm-runner/proxmox-runner/talm-runner."

[workspace]

[lib]
name = "ptyktos_agent_runner"
path = "src/lib.rs"

[[bin]]
name = "ptyktos-agent-runner"
path = "src/bin/ptyktos_agent_runner.rs"

# ─── runtime deps (always built) ─────────────────────────────────────
[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Test doubles (`testing` module). Off by default: a production build has no
# substrate, so the binary exits 2. Enabled for tests through the dev-dependency
# below.
[features]
default = []
test-substrate = []

[dev-dependencies]
ptyktos-agent-runner = { path = ".", features = ["test-substrate"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
